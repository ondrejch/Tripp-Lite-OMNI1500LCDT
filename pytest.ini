# UPS Power Monitor - pytest configuration

[pytest]
# Skip GUI tests if no display available
addopts = -v --tb=short
python_files = test_*.py
python_classes = *Test*
python_functions = test_*

# Marker for hardware-dependent tests (require actual UPS)
markers =
    hardware: Tests that require the physical UPS to be connected
    slow: Tests that take longer than typical

# Warning control
filterwarnings =
    ignore::DeprecationWarning
